[project]
name = "sv-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arnav Verma", email = "arnavverma522@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
# sv_engine.cli, not sv_engine: the package root has no main, so this was an
# ImportError for anyone invoking `sv-engine` rather than `python -m`.
# Importing the submodule still runs sv_engine/__init__ first, so the
# torch-before-faiss ordering that file guarantees is unaffected.
sv-engine = "sv_engine.cli:main"

# Docker on macOS has no MPS passthrough, so the container is CPU-only by
# design -- but on linux the default torch wheels drag in the entire CUDA
# toolkit, several gigabytes of it, for hardware the container cannot reach.
# Pinning linux to the CPU index keeps the image honest about what it runs.
# macOS resolution is untouched: the marker scopes this to linux only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that load the CLIP checkpoint",
]
