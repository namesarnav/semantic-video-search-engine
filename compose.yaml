services:
  sv-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: sv-engine:latest
    ports:
      - "8000:8000"
    volumes:
      # The store -- index, database, thumbnails, and anything uploaded
      # through the API -- so an ingested corpus survives `down` and `up`.
      - sv-data:/data
      # Host footage, mounted read-only at a path of its own rather than over
      # /data/videos. That directory has to stay writable: POST /videos/upload
      # saves into it, and mounting a read-only bind there would break that
      # endpoint at runtime rather than at startup.
      - ./data/videos:/videos:ro
      # The fetched corpus, likewise read-only. Without this the container
      # cannot see the bulk of the footage at all, and the demo runs against
      # whatever few clips happen to be in data/videos.
      - ./corpus:/corpus:ro
    restart: unless-stopped

volumes:
  sv-data:
